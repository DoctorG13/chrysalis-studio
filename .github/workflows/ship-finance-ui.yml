name: Ship finance UI refinements
on:
  push:
    paths:
      - .github/workflows/ship-finance-ui.yml
    branches:
      - feature/invoice-management-ui

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/invoice-management-ui
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refine Finance line item controls
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/pages/FinancePage.jsx';
          let source = fs.readFileSync(path, 'utf8');

          function replaceOnce(needle, replacement, label) {
            const count = source.split(needle).length - 1;
            if (count !== 1) {
              throw new Error(`${label}: expected 1 match, found ${count}`);
            }
            source = source.replace(needle, replacement);
          }

          replaceOnce(
            `const EMPTY_LINE = {\n  description: "",\n  quantity: 1,\n  rate: 0,\n};\n\nconst DEFAULT_GST_RATE = 0;\nconst DEFAULT_DEPOSIT_PERCENT = 25;`,
            `const EMPTY_LINE = {\n  garmentType: "Wedding Dress",\n  description: "",\n  quantity: 1,\n  rate: 0,\n};\n\nconst DEFAULT_GST_RATE = 0;\nconst DEFAULT_DEPOSIT_PERCENT = 25;\n\nconst GARMENT_TYPES = [\n  ["Wedding Dress", "Wedding Dress"],\n  ["Bridesmaid Dress", "Bridesmaid Dress"],\n  ["Evening Gown", "Evening Gown"],\n  ["Formal Dress", "Formal Dress"],\n  ["Alteration", "Alteration"],\n  ["Accessories", "Accessories"],\n  ["Other", "Other (add your own)"],\n];`,
            'garment constants'
          );

          replaceOnce(
            `function normaliseLineItems(items) {\n  return (Array.isArray(items)\n    ? items\n    : []\n  ).map((item) => ({\n    description: String(\n      item.description || ""\n    ),\n    quantity: Number(\n      item.quantity || 0\n    ),\n    rate: Number(\n      item.rate || 0\n    ),\n  }));\n}`,
            `function normaliseLineItems(items) {\n  return (Array.isArray(items)\n    ? items\n    : []\n  ).map((item) => ({\n    garmentType: GARMENT_TYPES.some(\n      ([value]) => value === item.garmentType\n    )\n      ? item.garmentType\n      : "Other",\n    description: String(\n      item.description || ""\n    ),\n    quantity: Number(\n      item.quantity || 0\n    ),\n    rate: Number(\n      item.rate || 0\n    ),\n  }));\n}`,
            'line normalisation'
          );

          const oldQuoteHeader = `                    gridTemplateColumns:\n                        "1fr 100px 130px 120px 40px",\n                      gap: 8,\n                      padding:\n                        "0 0 8px",\n                      color: "#888",\n                      fontSize: 12,\n                      fontWeight: 700,\n                    }}\n                  >\n                    <span>\n                      Description\n                    </span>\n                    <span>Qty</span>\n                    <span>Rate</span>\n                    <span>Total</span>\n                    <span />`;

          const newQuoteHeader = `                    gridTemplateColumns:\n                        "170px 1fr 100px 130px 120px 40px",\n                      gap: 8,\n                      padding:\n                        "0 0 8px",\n                      color: "#888",\n                      fontSize: 12,\n                      fontWeight: 700,\n                    }}\n                  >\n                    <span>\n                      Garment Type\n                    </span>\n                    <span>\n                      Description\n                    </span>\n                    <span>Qty</span>\n                    <span>Rate</span>\n                    <span>Total</span>\n                    <span />`;

          replaceOnce(oldQuoteHeader, newQuoteHeader, 'quote line header');

          const oldQuoteRow = `                        style={{\n                          display: "grid",\n                          gridTemplateColumns:\n                            "1fr 100px 130px 120px 40px",\n                          gap: 8,\n                          marginBottom: 8,\n                        }}\n                      >\n                        <input\n                          value={\n                            item.description\n                          }\n                          placeholder="Service or garment"\n                          onChange={(e) =>\n                            updateLine(\n                              index,\n                              "description",\n                              e.target\n                                .value\n                            )\n                          }\n                          style={input}\n                        />`;

          const newQuoteRow = `                        style={{\n                          display: "grid",\n                          gridTemplateColumns:\n                            "170px 1fr 100px 130px 120px 40px",\n                          gap: 8,\n                          marginBottom: 8,\n                        }}\n                      >\n                        <select\n                          value={\n                            item.garmentType || "Wedding Dress"\n                          }\n                          onChange={(e) =>\n                            updateLine(\n                              index,\n                              "garmentType",\n                              e.target.value\n                            )\n                          }\n                          style={input}\n                          aria-label="Garment type"\n                        >\n                          {GARMENT_TYPES.map(\n                            ([value, label]) => (\n                              <option\n                                key={value}\n                                value={value}\n                              >\n                                {label}\n                              </option>\n                            )\n                          )}\n                        </select>\n\n                        <input\n                          value={\n                            item.description\n                          }\n                          placeholder={\n                            item.garmentType === "Other"\n                              ? "Enter garment or service"\n                              : "Description or details"\n                          }\n                          onChange={(e) =>\n                            updateLine(\n                              index,\n                              "description",\n                              e.target\n                                .value\n                            )\n                          }\n                          style={input}\n                        />`;

          replaceOnce(oldQuoteRow, newQuoteRow, 'quote line row');

          const oldInvoiceHeader = `                    gridTemplateColumns:\n                      "1fr 100px 130px 120px 40px",\n                    gap: 8,\n                    padding:\n                      "0 0 8px",\n                    color: "#888",\n                    fontSize: 12,\n                    fontWeight: 700,\n                  }}\n                >\n                  <span>\n                    Description\n                  </span>\n                  <span>\n                    Qty\n                  </span>\n                  <span>\n                    Rate\n                  </span>\n                  <span>\n                    Total\n                  </span>\n                  <span />`;

          const newInvoiceHeader = `                    gridTemplateColumns:\n                      "170px 1fr 100px 130px 120px 40px",\n                    gap: 8,\n                    padding:\n                      "0 0 8px",\n                    color: "#888",\n                    fontSize: 12,\n                    fontWeight: 700,\n                  }}\n                >\n                  <span>\n                    Garment Type\n                  </span>\n                  <span>\n                    Description\n                  </span>\n                  <span>\n                    Qty\n                  </span>\n                  <span>\n                    Rate\n                  </span>\n                  <span>\n                    Total\n                  </span>\n                  <span />`;

          replaceOnce(oldInvoiceHeader, newInvoiceHeader, 'invoice line header');

          const oldInvoiceRow = `                      style={{\n                        display:\n                          "grid",\n                        gridTemplateColumns:\n                          "1fr 100px 130px 120px 40px",\n                        gap: 8,\n                        marginBottom:\n                          8,\n                      }}\n                    >\n                      <input\n                        value={\n                          item.description\n                        }\n                        placeholder="Service or garment"\n                        onChange={(e) =>\n                          updateLine(\n                            index,\n                            "description",\n                            e.target\n                              .value\n                          )\n                        }\n                        style={input}\n                      />`;

          const newInvoiceRow = `                      style={{\n                        display:\n                          "grid",\n                        gridTemplateColumns:\n                          "170px 1fr 100px 130px 120px 40px",\n                        gap: 8,\n                        marginBottom:\n                          8,\n                      }}\n                    >\n                      <select\n                        value={\n                          item.garmentType || "Wedding Dress"\n                        }\n                        onChange={(e) =>\n                          updateLine(\n                            index,\n                            "garmentType",\n                            e.target.value\n                          )\n                        }\n                        style={input}\n                        aria-label="Garment type"\n                      >\n                        {GARMENT_TYPES.map(\n                          ([value, label]) => (\n                            <option\n                              key={value}\n                              value={value}\n                            >\n                              {label}\n                            </option>\n                          )\n                        )}\n                      </select>\n\n                      <input\n                        value={\n                          item.description\n                        }\n                        placeholder={\n                          item.garmentType === "Other"\n                            ? "Enter garment or service"\n                            : "Description or details"\n                        }\n                        onChange={(e) =>\n                          updateLine(\n                            index,\n                            "description",\n                            e.target\n                              .value\n                          )\n                        }\n                        style={input}\n                      />`;

          replaceOnce(oldInvoiceRow, newInvoiceRow, 'invoice line row');

          const gstSelectWidths = source.split('width: 90,').length - 1;
          if (gstSelectWidths !== 1) {
            throw new Error(`quote GST width: expected 1 match, found ${gstSelectWidths}`);
          }
          source = source.replace('width: 90,', 'width: 175,');

          const depositWidths = source.split('width: 75,').length - 1;
          if (depositWidths !== 1) {
            throw new Error(`deposit width: expected 1 match, found ${depositWidths}`);
          }
          source = source.replace('width: 75,', 'width: 105,');

          const invoiceGstWidths = source.split('width: 150,').length - 1;
          if (invoiceGstWidths !== 1) {
            throw new Error(`invoice GST width: expected 1 match, found ${invoiceGstWidths}`);
          }
          source = source.replace('width: 150,', 'width: 175,');

          fs.writeFileSync(path, source);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/FinancePage.jsx .github/workflows/ship-finance-ui.yml
          git rm .github/workflows/ship-finance-ui.yml
          git commit -m "feat: refine finance line item controls"
          git push origin HEAD:feature/invoice-management-ui
